# Generated by tools/publish-site.mjs. Edit it there.
name: tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Never let two ticks overlap. Both would read the same finished episode and
# both would try to start the next one.
concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tick.mjs
        env:
          WIX_ADMIN_KEY: ${{ secrets.WIX_ADMIN_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
