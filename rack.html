<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b10" />
    <title>Denoms — Weapon Rack</title>
    <script type="module" crossorigin src="./assets/rack-BWh6Uqbl.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/fighterView-u-QexL0X.js">
    <link rel="stylesheet" crossorigin href="./assets/fighterView-DespZ0Pi.css">
  </head>
  <body class="rack-body">
    <canvas id="rack-stage"></canvas>
    <div id="rack-labels"></div>

    <div id="rack-controls">
      <div class="rc-title">WEAPON RACK</div>
      <label class="rc">
        <span>SIZE <b id="rc-size-val">p50</b></span>
        <input id="rc-size" type="range" min="0" max="100" value="50" />
      </label>
      <label class="rc">
        <span>POSE <b id="rc-pose-val">rest</b></span>
        <input id="rc-pose" type="range" min="0" max="100" value="0" />
      </label>
      <label class="rc">
        <span>SPIN <b id="rc-spin-val">on</b></span>
        <input id="rc-spin" type="range" min="0" max="100" value="35" />
      </label>
      <div class="rc-note">
        Every cell is framed identically, so cell-to-cell size is real.
        The pale ring is the body's collision radius &times; 1.4.
      </div>
    </div>
  </body>
</html>
